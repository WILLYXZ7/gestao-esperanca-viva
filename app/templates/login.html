{% extends 'base.html' %}

{% block title %}Login — Gestão Esperança Viva{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                <i class="bi bi-shield-lock-fill display-5" aria-hidden="true"></i>
                <h1 class="h4 mt-2 mb-1 fw-bold">Acesso Operacional</h1>
                <p class="small text-white-50 mb-0">Associação Comunitária Esperança Viva</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('main.login') }}" method="POST" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">E-mail Institucional</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" value="regina.alves@esperancaviva.org" required placeholder="nome@esperancaviva.org" autocomplete="username">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Senha de Acesso</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" value="Esperanca@2026" required placeholder="••••••••" autocomplete="current-password">
                        </div>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold py-3 shadow-sm" style="min-height: 48px;">
                            <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i> ENTRAR NO SISTEMA
                        </button>
                    </div>
                    <div class="alert alert-secondary text-center small mb-0 py-2">
                        <i class="bi bi-info-circle me-1"></i> Usuário de demonstração carregado para testes.
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
